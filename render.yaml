services:
  # Q-RADAR Streamlit Web Application
  - type: web
    name: q-radar-ui
    env: python
    buildCommand: pip install -r requirements.txt && python generate_sample_assets.py
    startCommand: python -m streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # Q-RADAR FastAPI REST Backend Service
  - type: web
    name: q-radar-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
